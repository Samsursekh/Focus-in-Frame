    <script>
      // Fix for "Cannot set property fetch" errors in some sandboxed environments where window.fetch is a read-only getter
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return this._customFetch || originalFetch; },
            set: function(value) { this._customFetch = value; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Focus in Frame: Could not re-define fetch property', e);
        }
      })();
    </script>
